<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Rounded rectangle background with CITRA's main warm editorial Primary Forest color (#17624A) -->
  <rect width="180" height="180" rx="36" fill="#17624A" />
  
  <!-- Stylized Mountain & Wave motif representing the landscape of Ciayumajakuning -->
  <!-- Back mountain in sandy color (#DFC291) -->
  <path d="M125 55L80 135H170L125 55Z" fill="#DFC291" opacity="0.8" />
  
  <!-- Front mountain in white -->
  <path d="M70 35L10 135H130L70 35Z" fill="#FAF7F1" />
  
